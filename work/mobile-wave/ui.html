<div id="hud" class="game-toolbar new-gamebar"><div class="game-brand"><b>梦想直聘</b><span id="current-stage"></span></div><div class="bar-actions"><button id="start-run">开始</button><button id="pause-game" aria-label="暂停游戏">暂停</button><button id="task-toggle" aria-expanded="false">任务</button><button id="settings-toggle" aria-expanded="false">设置</button></div><button id="weapon" hidden>1 射击</button><span id="progress" hidden>0%</span><button id="finish" hidden>结束</button></div>
<div id="battle-strip"><span id="battle-summary"></span><button id="find-enemy">找小怪</button><button id="quick-finish" hidden>通关结算</button><progress id="battle-meter" aria-label="本关通关进度"></progress><span id="quick-shield"></span><span id="next-upgrade"></span></div>
<section id="settings-sheet" class="game-sheet" hidden aria-label="游戏设置"><div class="sheet-heading"><b>关卡与设置</b><button id="settings-close">关闭</button></div><div id="settings-level"></div><div class="setting-row"><button id="music" aria-label="背景音乐开关" aria-pressed="true">音乐</button><span id="music-track"></span></div><label class="setting-row">音乐音量<input id="music-volume" type="range" min="0" max="60" value="28" aria-label="背景音乐音量"></label><button id="audio">音效 开</button><label class="setting-row">画面缩放<select id="view-zoom" aria-label="画面缩放"><option value="0.8">远景</option><option value="1" selected>标准</option><option value="1.2">近景</option></select></label><div class="setting-row"><button id="reset">重试本关</button><button id="new-run">新一轮</button></div><p>全关卡：空格 / W / ↑ 上升，S / ↓ 下降。A / D 左右移动，松开悬停。<br>手机：左摇杆移动；按住右侧射击区自动瞄准，拖动可手动瞄准。<br>升级枪械会同步增强榴弹和橡皮擦。</p></section>
<nav id="weapon-dock" aria-label="武器选择"><button data-weapon="0" aria-pressed="true"><b>01 连发枪</b><span></span><small></small></button><button data-weapon="1" aria-pressed="false"><b>02 榴弹</b><span></span><small></small></button><button data-weapon="2" aria-pressed="false"><b>03 橡皮擦</b><span></span><small></small></button></nav>
<div id="touch-controls"><div id="joy" role="button" aria-label="四向移动摇杆"><span class="joy-arrows">↑<br>←　→<br>↓</span><span id="joy-thumb"></span><small>移动 / 飞升</small></div><div id="fire-pad" role="button" aria-label="按住射击，拖动瞄准"><b>射击</b><span>按住自动瞄准</span><small>拖动手动瞄准</small></div></div>
